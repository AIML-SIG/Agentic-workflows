name: Regenerate leaderboard

# Fires when a results-carrying PR merges. A merge into main *is* a push to main,
# so a paths-filtered push trigger covers it -- and also covers a maintainer
# pushing results directly, which `pull_request: [closed]` would miss.
#
# This is the central regeneration #18 and #21 depend on. Contributor PRs add only
# their results/<slug>/ folders; the board is generated here, once, from all of
# them. That is why concurrent PRs never collide on docs/leaderboard.qmd.
on:
  push:
    branches: [main]
    paths:
      - 'tools/pharmbench/results/**'
  workflow_dispatch:

# Serialise. Several submissions can merge in the same week -- the whole point of
# the First Run milestone -- and two renders racing to push docs/ would conflict.
# Not cancel-in-progress: each run regenerates from the full results/ tree, so
# letting them queue costs a minute and removes the failure mode entirely.
concurrency:
  group: leaderboard
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pyyaml
        run: pip install pyyaml

      # Both flags are required and have each regressed once when run by hand.
      # Encoding them here is the actual fix -- nobody types them again.
      #
      # --no-individual-runs can be dropped now that results/ lives on main and
      # the per-run links resolve (see #21). Left on so the board matches what is
      # published today; flipping it is a one-line change.
      - name: Regenerate docs/leaderboard.qmd
        working-directory: tools/pharmbench
        run: |
          python3 generate_leaderboard.py \
            --exclude-dataset pmb-mab-pkpd-v0 \
            --no-individual-runs

      # Writes only docs/, while the trigger watches only
      # tools/pharmbench/results/ -- so this commit cannot retrigger the workflow.
      - name: Commit the board if it changed
        run: |
          if git diff --quiet -- docs/leaderboard.qmd; then
            echo "Board unchanged; nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/leaderboard.qmd
          git commit -m "Regenerate leaderboard from results/ [skip ci]"
          git push

      - uses: quarto-dev/quarto-actions/setup@v2

      # Renders docs/ and pushes the built site to gh-pages, which is what the
      # repo's GitHub Pages deploy serves. Without this the qmd would update on
      # main but the published board would not move -- the gap #21 is about.
      - name: Render and publish to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
