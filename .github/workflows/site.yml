name: Build and publish the site

# Owns the whole path from a merged result to the live page: generate the
# leaderboard, render the Quarto site, deploy it to GitHub Pages.
#
# CI is the only author of docs/leaderboard.qmd. It is generated here from
# results/ on every run and is not tracked in git, so there is no committed copy
# that can drift out of step with the runs -- and nothing tempting a contributor
# to regenerate it in their PR, which #18 forbids.
#
# Results live in the private repo AIML-SIG/pmxbench-private. After recording
# one, run this workflow by hand (workflow_dispatch). A push to main that touches
# the site or the public scenarios rebuilds too.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tools/pmxbench/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

# Serialise. Several submissions can merge in the same week -- the whole point of
# the First Run milestone -- and two runs racing to deploy Pages would conflict.
# Not cancel-in-progress: generation reads the full results tree and a
# half-finished deploy is worse than a queued one.
concurrency:
  group: site
  cancel-in-progress: false

permissions:
  contents: read    # read-only: the board is never committed back, only rendered
  pages: write      # deploy to GitHub Pages
  id-token: write   # OIDC for the Pages deployment

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pyyaml
        run: pip install pyyaml

      # The results and the leaderboard builder are private. A read-only deploy
      # key on pmxbench-private, stored here as PMXBENCH_PRIVATE_KEY, lets this job
      # read them. Secrets are not exposed to pull requests from forks, and this
      # workflow only runs on main.
      - uses: actions/checkout@v4
        with:
          repository: AIML-SIG/pmxbench-private
          ssh-key: ${{ secrets.PMXBENCH_PRIVATE_KEY }}
          path: pmxbench-private

      # docs/leaderboard.qmd is NOT tracked in git -- it is generated here, on
      # every run, and consumed by the render step below. CI is its only author,
      # so this job needs no write access and nothing is ever pushed to main.
      - name: Generate docs/leaderboard.qmd
        run: |
          python3 pmxbench-private/tools/build_leaderboard.py \
            --public-dir tools/pmxbench \
            --out docs/leaderboard.qmd

      # One zip per public scenario, so the intro page can offer "download all".
      - name: Zip each scenario's files
        run: |
          mkdir -p docs/downloads
          for d in tools/pmxbench/scenario_*/; do
            (cd "$d" && zip -q -j "$GITHUB_WORKSPACE/docs/downloads/$(basename "$d").zip" ./*)
          done

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render the site
        run: quarto render docs

      # Native Pages deployment, replacing the legacy build-from-gh-pages-branch
      # path. No gh-pages branch to keep in sync, and the deploy is a first-class
      # step with its own logs instead of an opaque background build.
      #
      # REQUIRES: Settings -> Pages -> Source must be "GitHub Actions", not
      # "Deploy from a branch". Until that is switched the site will not update.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
