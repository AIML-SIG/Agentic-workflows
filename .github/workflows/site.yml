name: Build and publish the site

# Renders the Quarto site and deploys it to GitHub Pages on any push to main
# that touches the site or the public PMxbench files.
#
# docs/leaderboard.qmd is committed. Maintainers generate it from the private
# repo AIML-SIG/pmxbench-private (tools/build_leaderboard.py) after recording a
# submission, and merge it here by PR. So this build needs no secret and never
# reads anything private.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tools/pmxbench/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

# Serialise: two runs racing to deploy Pages would conflict, and a half-finished
# deploy is worse than a queued one.
concurrency:
  group: site
  cancel-in-progress: false

permissions:
  contents: read    # nothing is ever pushed back
  pages: write      # deploy to GitHub Pages
  id-token: write   # OIDC for the Pages deployment

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # One zip per public scenario, so the intro page can offer "download all".
      - name: Zip each scenario's files
        run: |
          mkdir -p docs/downloads
          for d in tools/pmxbench/scenario_*/; do
            (cd "$d" && zip -q -j "$GITHUB_WORKSPACE/docs/downloads/$(basename "$d").zip" ./*)
          done

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render the site
        run: quarto render docs

      # REQUIRES: Settings -> Pages -> Source must be "GitHub Actions".
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
