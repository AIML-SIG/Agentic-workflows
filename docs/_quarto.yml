project:
  type: website
  output-dir: _site

website:
  title: "Agentic Workflows in PMx"
  page-navigation: true

  navbar:
    background: light
    left:
      - text: "Glossary"
        href: learning/glossary/agent.qmd
      - text: "Leaderboard"
        href: leaderboard.qmd
    right:
      # Labelled rather than icon-only. Much of this audience arrives from a talk
      # or a LinkedIn post to read the glossary, not from GitHub, and a bare
      # octocat is easy to miss if you are not already looking for one.
      - text: "Repo"
        icon: github
        href: https://github.com/AIML-SIG/Agentic-workflows
        aria-label: "Agentic Workflows on GitHub"

  sidebar:
    - id: glossary
      title: "Glossary"
      style: floating
      collapse-level: 2
      search: true
      contents:
        - text: "Agent"
          href: learning/glossary/agent.qmd
        - text: "Harness"
          href: learning/glossary/harness.qmd
        - text: "MCP (Model Context Protocol)"
          href: learning/glossary/mcp.qmd
        - text: "Tools"
          href: learning/glossary/tools.qmd

format:
  html:
    theme: cosmo
    toc: true
    toc-title: "On this page"