# The answer key. One item per submission key in sap.md section 9.
# Every value here is read off the true model in generate.R.
#
# Each item names its scorer (the scorers are described at the top of score.py)
# and, where it carries a trap, says so in a comment: what the trap catches and
# where the scenario legitimately exposes the analyst to it.

meta:
  dataset: pmb-mab-poppk-v0
  datagen_seed: 1234

items:
  - id: structural_ncmt
    pmx_area: structural
    scorer: categorical
    expected: 2
    weight: 1

  # Typical (population) disposition parameters of the final model, matched by
  # name. The analyst reports whatever parameters their chosen structure has, so a
  # wrong structure (e.g. 1-cmt: no Q/Vp) self-penalizes via the missing names.
  #
  # TRAP (implicit), BLQ: ~10% of observations sit below the LLOQ, predose zeros
  # plus genuine terminal censoring at days 90/120/150. Treating DV = 0 as a real
  # zero, or silently dropping the records, biases the terminal phase. It surfaces
  # here and in error_model through the numeric tolerance. Exposed by sap.md 8.
  - id: disposition_params
    pmx_area: estimation
    scorer: map
    expected:
      CL: 0.20    # L/day at 70 kg
      Vc: 3.0     # L
      Q:  0.6     # L/day
      Vp: 3.0     # L
    tol: 0.20     # relative, per matched parameter
    aliases:
      CL: [cl, clearance]
      Vc: [vc, v, v1, v2c, vcentral, vc1, central]
      Q:  [q, cld, q2, intercompartmental_cl]
      Vp: [vp, v2, vperiph, peripheral]
    weight: 1

  # Residual error terms by name. Truth is proportional-only (15%); a submission
  # that adds a spurious additive term gets a 0 for that extra name.
  - id: error_model
    pmx_area: estimation
    scorer: map
    expected:
      prop: 0.15
    tol: 0.25
    aliases:
      prop: [proportional, prop_sd, prop.sd, cv, sigma_prop]
      add:  [additive, add_sd, add.sd, sigma_add]
    weight: 1

  # Covariate effects grouped by the parameter they act on.
  #
  # SIGNAL, WT: a power model on CL (0.75) and Vc (1.0). Catches fixing allometric
  # exponents instead of estimating them, and missing that WT also acts on volume.
  #
  # TRAP (decoy), ALB: correlated with WT (r ~0.4), zero effect. Univariate
  # screening flags it; testing it with WT already in the model clears it. Exposed
  # because sap.md 7 lists ALB as a candidate, as a defensively written SAP would.
  #
  # TRAP (decoy), CRCL: independent of WT, zero effect. Renal function is a
  # small-molecule reflex; a ~150 kDa IgG1 is catabolized, not filtered (sap.md 1).
  # The trap is whether mechanism overrides the habit of putting CRCL on CL.
  #
  # Reporting either decoy on any parameter is an unmatched key (scores 0).
  - id: cov_effects
    pmx_area: covariate-analysis
    scorer: map_nested
    expected:
      CL: { WT: 0.75 }   # power exponent
      Vc: { WT: 1.00 }   # power exponent
    decoys: [ALB, CRCL]
    tol: 0.20
    aliases:
      CL: [cl, clearance]
      Vc: [vc, v, v1, vcentral, central]
      WT: [wt, weight, bw, body_weight]
      ALB: [alb, albumin]
      CRCL: [crcl, clcr, creatinine_clearance]
    weight: 1

  # TRAP, data-entry outliers: subjects 5/50/95 at day 7 carry DV x10, a decimal
  # slip. Catches skipping per-subject QC. Exposed by sap.md 8 (data quality).
  # ROWIDs are printed by generate.R.
  - id: outlier_records
    pmx_area: data-quality
    scorer: set
    expected: ["62", "692", "1322"]
    weight: 1
